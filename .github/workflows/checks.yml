name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke-test every course's content and generators
        run: node tools/check-content.js 1000
      - name: Test the study logic (grading, store, scheduling, exam builder)
        run: node tools/check-app.js
